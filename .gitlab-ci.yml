stages:
  - validate
  - test
  - e2e

default:
  image: node:20-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .next/cache/

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

lint_and_typecheck:
  stage: validate
  script:
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

unit_tests:
  stage: test
  script:
    - npm ci
    - npm run test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

e2e_tests:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  allow_failure: true
  script:
    - npm ci
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
    reports:
      junit: playwright-junit.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH
