stages:
  - validate
  - test
  - e2e
  - preview
  - production

default:
  image: node:20-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .next/cache/

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

lint_and_typecheck:
  stage: validate
  script:
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

unit_tests:
  stage: test
  script:
    - npm ci
    - npm run test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

e2e_tests:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  allow_failure: true
  script:
    - npm ci
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
    reports:
      junit: playwright-junit.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

deploy_preview:
  stage: preview
  before_script:
    - npm install --global vercel
    - mkdir -p .vercel
    - echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
  script:
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - vercel build --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --token=$VERCEL_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

deploy_production:
  stage: production
  before_script:
    - npm install --global vercel
    - mkdir -p .vercel
    - echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
  script:
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
